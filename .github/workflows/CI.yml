name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Julia ${{ matrix.version }}, CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        version: ['1.12']
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      # No Manifest is committed, so the branch dependencies resolve from the `[sources]` in Project.toml
      - uses: julia-actions/julia-buildpkg@v1
      # The default suite only: CPU, no large data. The GLOBALOCEAN_*_TESTS opt-in sets need local data.
      - uses: julia-actions/julia-runtest@v1
